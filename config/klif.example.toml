# KLIF configuration template (0.3).
#
# Copy this file to %APPDATA%\KLIF\klif.toml (macOS: ~/Library/Application Support/KLIF/klif.toml) and edit it, or
# point the KLIF_CONFIG environment variable at your copy. A developer checkout can also use .local\klif.toml
# (gitignored). Never commit a filled-in copy.
#
# Every path, address and model name below is fictional (D:\llama.cpp, D:\models, 192.0.2.x; on a Mac write
# /opt/llama.cpp/llama-server, /Users/<you>/models and the like: KLIF does not expand "~"). Replace them with yours. Until you do, the Systems show as "invalid" with the reason (program or model file missing); nothing
# is started by KLIF on its own.
#
# How the file is organised:
#   [systems.<id>]   one tab, one server at a time, in the order you write them here.
#   [presets.<id>]   one launch command (program, arguments, environment). A System points at one preset.
#   [net] [gpu] [ui] [telemetry] [paths] [security] [launch] [hardware] [webui]   machine-wide settings.
#   [node] / [nodes.<id>]   optional, for several machines (examples at the end, commented out).
#
# KLIF edits this file when you change something in the Tune drawer or with klif-cli. It keeps your comments and
# the order of your tables, except for comments inside an array KLIF has to rewrite (an edited `args` list), so
# put explanations above an array rather than inside it. A comment directly above a [table] header travels with
# that table; leave a blank line under a section comment if it should stay where it is.
# Edits you make in an editor are picked up while KLIF runs. A file that does not parse is ignored (KLIF keeps the
# last good configuration and shows the error).

[net]
# Default address a server binds to and KLIF talks to. Loopback unless you want the LAN to reach it.
# Presets of kind image use image_host, every other kind uses llm_host. A preset can override it with `host`.
llm_host = "127.0.0.1"
image_host = "127.0.0.1"

[gpu]
# PCI "VEN:DEV" ids (hex). `inference` is the card presets run on unless they say otherwise (their `gpu`).
# KLIF uses it for the memory bars, the fit check and conflicts between Systems. With two identical cards,
# "VEN:DEV" is the first one and "VEN:DEV#1" the second (DXGI order). The ids KLIF sees are listed by:
#   klif-cli --json diag        (engine.gpus[].id)
# inference = "1002:7550"      # example: an RDNA4 16 GiB card
# inference = "106B:8132"      # macOS: Apple's vendor id and the SoC id from the device tree (here t8132, an M4)
# ui = "1002:731F"             # optional: the card the window should render on (one that drives displays)
# inference_name = "RX 9070 XT"

[ui]
frameless = true
# Panel mode = the read-only mini layout on a small status screen (a 3.5" 960x640 monitor, say). Which monitor:
# a resolution ("960x640") or part of the monitor's device name ("DISPLAY3"). Unset = automatic: with two or more
# monitors, the smallest one if it is at most 1280x800.
# panel_monitor = "960x640"
# Celebrate a broken record over the skin (the "new record" moment). Records are kept either way.
# record_moment = false
# The skin the window shows (cliff, silicon, instrument, phosphor, decode, loom, ether, rings, spirit). The window
# writes this line when you change skins and follows a change made here; klif-webui follows it too.
# klif-cli settings skin <id> sets it.
# skin = "cliff"

[telemetry]
# Skins warn when free VRAM falls below this many GiB.
warn_below_gib = 0.15
# llama.cpp presets with managed = true get verbose logging, which is where KLIF reads the VRAM breakdown from.
verbose_llama_logs = true
# ram_type = "DDR5"            # display only; KLIF does not read firmware tables in the GUI

[paths]
# Where "Recommended" models are downloaded to. Unset = downloads are refused.
models_dir = 'D:\models'
# logs_dir = 'D:\klif-logs'    # default: <data folder>\logs (macOS, default folder: ~/Library/Logs/KLIF)

[security]
# The API key KLIF puts into llama.cpp and vLLM servers it starts (and into its own requests to them):
#   "file"      <folder of this klif.toml>\api-key.txt   (default; set it with: klif-cli key set)
#   "env:NAME"  read from KLIF's own environment variable NAME
#   "none"      no key (servers run without auth)
api_key = "file"

[launch]
# What Launch does when other Systems must stop first (same port, an exclusive System, or not enough free VRAM):
#   "ask"   refuse and name them; the Launch button then reads "Stop <names> & launch" (default)
#   "stop"  stop them first, then launch. A System that is busy generating is never stopped without an explicit
#           choice (klif-cli launch --stop-others, or the "Stop ... & launch" button).
on_conflict = "ask"

# KLIF reads this machine's GPUs, CPU and RAM and adds up their theoretical peak FP32 TFLOPS (klif-cli hardware).
# Every discrete GPU counts, whatever the vendor; an integrated GPU only counts on a machine that has no discrete
# one. Correct it here when KLIF is wrong. Ids are "VEN:DEV" (hex, as in [gpu]), "VEN:DEV#1" for the second
# identical card, or "cpu".
# [hardware]
# exclude = ["10DE:2684#1", "cpu"]                    # leave a card (or the CPU) out of the pool and the total
# include = ["1002:164E"]                             # count an integrated GPU although a discrete one exists
# tflops = { "1002:7550" = 48.7, cpu = 4.4 }          # peak FP32 TFLOPS for a card the built-in table lacks or gets wrong

# klif-webui: a small control page for a phone or a browser on your network (docs/webui.md). Off unless enabled here,
# in Tune > Web UI, or with klif-cli webui on. The KLIF window app (klif.exe) serves it over plain HTTP, and a device
# sees or controls nothing until it is paired (Tune > Web UI, or klif-cli webui pair --yes). Use it on a network you
# trust and never forward its port to the internet. Windows Defender Firewall asks about klif.exe the first time it
# listens on a network address: allow Private networks only. KLIF never changes firewall rules.
#   host  an IP address to listen on: "0.0.0.0" = every network of this machine (default), or the address of one
#         network of this machine ("127.0.0.1" = this computer only)
#   port  1 to 65535 (default 7341)
# [webui]
# enabled = true
# host = "0.0.0.0"
# port = 7341

# ------------------------------------------------------------------------------------------------ Systems
# Tab order = the order of these tables. Systems are independent: each has its own server, session and logs.
# Without a `label` KLIF derives one from kind and class (System 1/2/3, System CGI, System TTS, ...); a second
# System that would get the same label becomes "System 1 (2)", "System 1 (3)", ...

[systems.s1]
label = "System 1"             # tab label (default derived from kind and class: System 1/2/3, System CGI, ...)
kind = "llm"                   # llm | image | tts | stt | video | music
class = "fast"                 # llm only, optional: fast | deep | max (groups recommendations, default labels)
preset = "fast-8b"             # absent = "not set"
params = { reasoning = "on" }  # choices for the params the preset declares

[systems.s2]
label = "System 2"
kind = "llm"
class = "deep"
preset = "deep-27b"

[systems.s3]
label = "System 3"
kind = "llm"
class = "max"
preset = "max-moe"
exclusive = true               # needs the whole GPU: launching it lists every other System on that GPU as a conflict

[systems.cgi]
label = "System CGI"
kind = "image"
preset = "image-turbo"
params = { size = "1024" }

[systems.tts]
label = "System TTS"
kind = "tts"
preset = "tts-local"

[systems.lan-chat]             # an external server: KLIF only watches it, never starts or stops it
label = "Chat box"
kind = "llm"
preset = "chat-box"

# ------------------------------------------------------------------------------------------------ Presets
# A preset is a launch command, nothing hidden: the program, the argument list and the environment are exactly
# what KLIF starts (the Tune drawer and `klif-cli plan <system>` show the final command line).
#
# Placeholders in command, args, cwd and env values:
#   {model} {mmproj} {ctx}    the preset's own fields
#   {host} {port}             the effective address (see port / host)
#   {models_dir} {state_dir} {data_dir}
#   {stamp}                   the launch's time stamp, yyyyMMdd-HHmmss-fff (local time), for names that differ per launch
#                             (a server's --log-file, say). Previews show the text {stamp}.
#   {env:NAME}                KLIF's own environment variable NAME, read when the command is built
#   {p.NAME}                  a param (below): a whole args token that expands to the chosen choice's args
#   {p.NAME.VAR}              a param variable, one value
# Unknown placeholders are errors. Braces that do not look like {identifier} (JSON, say) stay as they are.

# llama.cpp. Pass {host} and {port} through, or the server listens somewhere KLIF is not looking.
# "{p.reasoning}" expands to the args of the selected choice (zero or more tokens).
# Flag names follow current llama.cpp; check llama-server --help for your build.
[presets.fast-8b]
name = "Fast 8B"
adapter = "llama.cpp"          # llama.cpp | sd.cpp | vllm | openai | audiocpp | generic
command = 'D:\llama.cpp\llama-server.exe'   # absolute path, or a program name on PATH; .exe/.com only
# command = '/opt/llama.cpp/llama-server'    # macOS: an executable file (Metal is built in)
args = [
  "-m", "{model}",
  "-c", "{ctx}",
  "-ngl", "99",
  "--jinja",
  "--host", "{host}",
  "--port", "{port}",
  "{p.reasoning}",
]
cwd = 'D:\llama.cpp'           # default: the folder of the program
env = { HIP_VISIBLE_DEVICES = "0", PATH = 'D:\ROCm\bin;{env:PATH}' }
port = 7030
model = 'D:\models\fast-8b-Q4_K_M.gguf'
ctx = 16384
quant = "Q4_K_M"
backend = "HIP"                # display only: HIP | Vulkan | CUDA | Metal | CPU | free text

[presets.fast-8b.params.reasoning]
label = "Reasoning"
default = "on"
choices.on = { args = ["--reasoning", "on"] }
choices.off = { label = "Off", args = ["--reasoning", "off"] }

[presets.deep-27b]
name = "Deep 27B"
adapter = "llama.cpp"
command = 'D:\llama.cpp\llama-server.exe'
args = ["-m", "{model}", "-c", "{ctx}", "-ngl", "99", "--jinja", "--host", "{host}", "--port", "{port}"]
env = { HIP_VISIBLE_DEVICES = "0", PATH = 'D:\ROCm\bin;{env:PATH}' }
port = 7031
model = 'D:\models\deep-27b-Q4_K_M.gguf'
ctx = 32768
quant = "Q4_K_M"
backend = "HIP"

# "--cpu-moe" keeps the expert weights of a mixture-of-experts model in system RAM.
[presets.max-moe]
name = "Max MoE 120B (CPU experts)"
adapter = "llama.cpp"
command = 'D:\llama.cpp\llama-server.exe'
args = ["-m", "{model}", "-c", "{ctx}", "-ngl", "99", "--cpu-moe", "--host", "{host}", "--port", "{port}"]
env = { HIP_VISIBLE_DEVICES = "0", PATH = 'D:\ROCm\bin;{env:PATH}' }
port = 7032
model = 'D:\models\max-moe-120b-Q4_K_M.gguf'
ctx = 65536
quant = "Q4_K_M"
backend = "HIP"

# stable-diffusion.cpp: an image preset. "{p.size}" is a param (below), so one preset serves every size.
[presets.image-turbo]
name = "Image turbo"
adapter = "sd.cpp"             # kind defaults to image for sd.cpp
command = 'D:\stable-diffusion.cpp\sd-server.exe'
args = [
  "--diffusion-model", "{model}",
  "--vae", 'D:\models\image-vae.safetensors',
  "--steps", "8",
  "{p.size}",
  "--listen-ip", "{host}",
  "--listen-port", "{port}",
]
env = { HIP_VISIBLE_DEVICES = "0" }
port = 1234
model = 'D:\models\image-turbo-Q8_0.gguf'
backend = "HIP"

[presets.image-turbo.params.size]
label = "Size"
default = "1024"
choices.512 = { label = "512 x 512", args = ["-W", "512", "-H", "512"] }
choices.1024 = { label = "1024 x 1024", args = ["-W", "1024", "-H", "1024"] }

# Text to speech through the generic adapter: any server that listens on a port. KLIF needs the kind (what the
# System is for) and a way to tell it is up (a port, plus optionally an HTTP health path). This one is fictional:
# put your own TTS server's program and arguments here.
[presets.tts-local]
name = "Local TTS"
adapter = "generic"
kind = "tts"
command = 'D:\tts\tts-server.exe'
args = ["--host", "{host}", "--port", "{port}"]
port = 8880
health = "/health"             # "/path" = HTTP, "tcp" = a listening port; absent = TCP for generic
gpu = "cpu"                    # "VEN:DEV" or "cpu": which GPU it counts against (display and fit only)
backend = "CPU"

# The presets below are commented out: uncomment one, put your own paths in, and point a System at it
# (`kind` and `preset` in its [systems.<id>] table). KLIF does not ship these servers; install them yourself.
#
# audio.cpp (text to speech): one audiocpp_server.exe serves VoxCPM2, Qwen3-TTS, Chatterbox and Kokoro (GGUF) on the
# OpenAI route /v1/audio/speech. Its models are listed in a JSON file (--config); `model` names the same GGUF so KLIF
# knows the file (name, size, records). A minimal D:\audio.cpp\voxcpm2.json:
#   { "lazy_load": true, "max_loaded_models": 1,
#     "models": [ { "id": "voxcpm2", "family": "voxcpm2", "task": "tts", "mode": "offline",
#                   "path": "D:\\models\\VoxCPM2-GGUF\\voxcpm2-q8_0.gguf" } ] }
# "{p.backend.dir}" picks the build (the official zip is Vulkan; HIP builds are separate downloads), "--backend"
# is also what the records call the backend. "--log" prints one line per request, which KLIF counts (--log-file
# writes a file KLIF does not read). TTS records come from: klif-cli bench <system> --yes
#
# [presets.voxcpm2]
# name = "VoxCPM2"
# adapter = "audiocpp"           # kind defaults to tts
# command = '{p.backend.dir}\audiocpp_server.exe'
# args = ["--config", 'D:\audio.cpp\voxcpm2.json', "{p.backend}", "{p.voice}", "{p.unload}", "--log", "--host", "{host}", "--port", "{port}"]
# port = 7060
# model = 'D:\models\VoxCPM2-GGUF\voxcpm2-q8_0.gguf'
# quant = "Q8_0"
#
# [presets.voxcpm2.params.backend]
# label = "Backend"
# default = "vulkan"
# choices.vulkan = { label = "Vulkan", vars = { dir = 'D:\audio.cpp' }, args = ["--backend", "vulkan"] }
# choices.hip = { label = "HIP", vars = { dir = 'D:\audio.cpp-hip' }, args = ["--backend", "hip"] }
#
# Voice cloning: with a voices folder, a request's "voice": "<name>" uses <folder>\<name>.wav.
# [presets.voxcpm2.params.voice]
# label = "Voices"
# default = "model"
# choices.model = { label = "Model voices only" }
# choices.folder = { label = "Voices folder", args = ["--voice-dir", 'D:\voices'] }
#
# [presets.voxcpm2.params.unload]
# label = "When idle"
# default = "keep"
# choices.keep = { label = "Keep the model loaded" }
# choices.unload = { label = "Unload after 5 minutes", args = ["--idle-unload-ms", "300000"] }
#
# audio.cpp music (ACE-Step 1.5, HeartMuLa, Stable Audio 3, ...): the same server and adapter with kind = "music".
# In the --config JSON the model's task is "gen" (speech models say "tts"), and a family may need options of its
# own (ACE-Step XL names its DiT variant in "load_options"). A song is one synchronous request that can take
# minutes, so raise --busy-timeout-ms (the default is 5 minutes). A minimal D:\audio.cpp\music-ace.json:
#   { "lazy_load": true, "max_loaded_models": 1,
#     "models": [ { "id": "ace-turbo", "family": "ace_step", "task": "gen", "mode": "offline",
#                   "path": "D:\\models\\ACE-Step1.5-GGUF\\ace-step-1.5-turbo-bf16.gguf",
#                   "session_options": { "ace_step.mem_saver": "true" } } ] }
# `klif-cli models adopt` writes this file for a pool model. Records come from: klif-cli bench <system> --yes (a
# fixed 30 s instrumental; musicRtf = seconds of music per wall second).
#
# [systems.music]
# label = "System Music"
# kind = "music"
# preset = "music-ace"
#
# [presets.music-ace]
# name = "ACE-Step 1.5 turbo"
# adapter = "audiocpp"
# kind = "music"                 # audiocpp defaults to tts
# command = 'D:\audio.cpp\audiocpp_server.exe'
# args = ["--config", 'D:\audio.cpp\music-ace.json', "--backend", "vulkan", "--busy-timeout-ms", "900000", "--log", "--host", "{host}", "--port", "{port}"]
# port = 7080
# model = 'D:\models\ACE-Step1.5-GGUF\ace-step-1.5-turbo-bf16.gguf'
# quant = "BF16"
# backend = "Vulkan"
#
# whisper.cpp (speech to text) through the generic adapter: whisper-server answers /health (503 while its model
# loads) and logs nothing per request beyond the file name. --inference-path makes it OpenAI-compatible. The official
# Windows zips are CPU / CUDA only; on AMD use a Vulkan or HIP build. Records come from:
#   klif-cli bench <system> --audio <speech.wav> --yes
#
# [presets.whisper-turbo]
# name = "Whisper large-v3 turbo"
# adapter = "generic"
# kind = "stt"
# command = 'D:\whisper.cpp\whisper-server.exe'
# args = ["-m", "{model}", "-t", "4", "-fa", "-l", "auto", "--inference-path", "/v1/audio/transcriptions", "--host", "{host}", "--port", "{port}"]
# port = 7070
# health = "/health"
# model = 'D:\models\ggml-large-v3-turbo-q5_0.bin'
# quant = "Q5_0"
# backend = "Vulkan"
#
# stable-diffusion.cpp video with MiniMax H3 (video with its own stereo audio; jobs arrive on POST
# /sdcpp/v1/vid_gen). LICENSE: the MiniMax H3 Community License grants no rights in the European Union, the United
# Kingdom, South Korea or the United States; read it before you download or use the model. H3 is distilled
# (--cfg-scale must be 1.0); "--backend te=cpu" and --offload-to-cpu keep the 32B text encoder off a 16 GB card.
# KLIF reads every finished job from the log into a videoS record (size, frames, steps).
#
# [presets.video-h3]
# name = "MiniMax H3"
# adapter = "sd.cpp"
# kind = "video"                 # sd.cpp defaults to image
# command = 'D:\stable-diffusion.cpp\sd-server.exe'
# args = ["--diffusion-model", "{model}", "--vae", 'D:\models\h3\minimax_h3_video_vae_fp16.safetensors', "--audio-vae", 'D:\models\h3\minimax_h3_audio_vae_fp32.safetensors', "--llm", 'D:\models\h3\qwen3vl_32b_minimax_h3-Q4_K_M.gguf', "--cfg-scale", "1.0", "--diffusion-fa", "--offload-to-cpu", "--backend", "te=cpu", "--listen-ip", "{host}", "--listen-port", "{port}"]
# port = 1235
# model = 'D:\models\h3\minimax_h3_fl2va_pruned-Q4_K.gguf'
# quant = "Q4_K"

# An external server: `endpoint` instead of `command`. KLIF never starts, stops or restarts it; it only shows
# whether it answers and what it is doing. Launch and Stop are refused with a sentence.
[presets.chat-box]
name = "Chat box (other machine)"
adapter = "openai"             # llama.cpp | vllm | openai | generic all work as external
endpoint = "http://192.0.2.20:11434"
model_name = "Some model on that machine"   # display only
backend = "CPU"

# ------------------------------------------------------------------------------------------ More machines
# Make THIS machine reachable from another KLIF (off unless `listen` is set). Read docs/nodes.md first:
# "edit" lets the other machine run arbitrary commands here, and traffic is plain TCP (not encrypted).
# Create the token once with:  klif-cli node token --create     (printed once, stored in node-token.txt)
#
# [node]
# name = "Render box"
# listen = "0.0.0.0:7340"      # opt-in; default port 7340
# allow = ["launch"]           # besides view: "launch" (launch/stop/restart/params), "edit" (presets, Systems, downloads)
#
# Show another machine's Systems in this KLIF. The token is never written here: "file:" (relative to this file's
# folder, or absolute) or "env:NAME".
#
# [nodes.render-box]
# address = "192.0.2.10:7340"
# token = "file:render-box.token"
# name = "Render box"          # display; default: what the node reports
