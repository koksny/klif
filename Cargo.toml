[workspace]
resolver = "2"
members = [
  "crates/klif-common",
  "crates/klif-catalog",
  "crates/klif-supervisor",
  "crates/klif-telemetry",
  "crates/klif-core",
]
# app/src-tauri is its own crate (Tauri convention) and depends on crates/klif-core by path.

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
rust-version = "1.90"

[workspace.dependencies]
# windows 0.62 is pinned to match tauri / wry / webview2-com so COM types unify.
windows = "0.62"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
anyhow = "1"
thiserror = "2"
regex = "1"
log = "0.4"
ureq = { version = "3", default-features = false, features = ["json"] }
