# Builds and checks KLIF on the three platforms it runs on: the commands CONTRIBUTING.md asks of a pull request
# (there is no test suite). Nothing is built for release or published here.
name: Check

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7

      - name: Linux packages (WebKitGTK 4.1, tray)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends build-essential pkg-config libssl-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            app/src-tauri -> target

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/ui/package-lock.json

      # The window app embeds app/ui/dist, so the UI is built before app/src-tauri is checked.
      - name: UI (svelte-check, build)
        working-directory: app/ui
        run: |
          npm ci --no-audit --no-fund
          npm run check
          npm run build

      - name: Crates and klif-cli
        run: cargo check --workspace --all-targets --locked

      - name: Window app
        working-directory: app/src-tauri
        run: cargo check --locked
