[package]
name = "klif-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "KLIF command-line interface: inspect, tune and calibrate KLIF from a terminal or a coding agent"
publish = false
build = "build.rs"

[dependencies]
klif-core = { path = "../klif-core", features = ["schema"] }
# diag reads the RAM type from SMBIOS: only klif-cli enables the reader, so klif.exe never contains it.
klif-telemetry = { path = "../klif-telemetry", features = ["smbios"] }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
log.workspace = true
ureq = { workspace = true, features = ["native-tls"] }
# `presets save --file f.toml` and `presets show` (TOML in and out).
toml.workspace = true
# `klif-cli schema`: JSON Schema of every command's output.
schemars = "1"

# klif-cli.exe VERSIONINFO + manifest (build.rs).
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[[bin]]
name = "klif-cli"
path = "src/main.rs"
