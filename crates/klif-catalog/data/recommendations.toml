# KLIF model pool, schema 2: the models KLIF suggests per machine (klif-cli suggest, Tune), embedded in klif.exe.
#
# Disclaimer: every memory number here and every suggestion made from it is an ESTIMATE. Models, drivers and
# backends change; your agent should benchmark and calibrate (`klif-cli bench <system>`). Each model keeps its own
# license. KLIF downloads only from huggingface.co, and only when you ask it to.
#
# Each [[model]] has a ladder of [[model.quant]] rungs. Every (model, quant) becomes one recommendation with the id
# "<model id>.<quant id>" (klif-cli models list / download / adopt). Rules (checked at load; a bad model or rung is
# skipped with a warning):
# - hf_repo is "owner/name", revision a 40-hex commit sha, file names plain paths inside the repo (no "..", each
#   listed once); repo + revision + every file's sha256 and size were read from the Hugging Face API;
# - a rung may name its own hf_repo + revision (e.g. the QAT repo); a file from ANOTHER repo names its own `repo` and
#   `revision` (40-hex, required with `repo`);
# - `save_as` stores a file under another path below the repo's install folder (a replacement shard that must sit
#   where the original would);
# - a preset made from a rung gets `model` from the first file with role "model" and `mmproj` from the one with role
#   "mmproj"; args may name any other file as {file:<its name>} or {file:<its key>};
# - args are a template: {ctx} and the -ctk / -ctv / -fitt values come from the suggestion when it is adopted;
# - a model of the audiocpp adapter has no model flag: audio.cpp reads a server JSON that KLIF writes on adopt
#   (`--config`, one file per rung). `audiocpp = { load_options = {..}, session_options = {..} }` carries the family
#   options that JSON names for the model; keys are "<family>.<option>", values plain words (no paths, no secrets);
#   the JSON's task follows the kind (tts -> "tts", music -> "gen");
# - `measured` only when the local file's sha256 equals the hub file;
# - no network / model-fetch flags in `args` (-hf --hf-repo -hff --hf-file -hft --hf-token -mu --model-url
#   -dr --docker-repo, and their draft / vocoder / mmproj-url forms), no secret flags (--api-key), no env
#   templates, no unknown keys;
# - no personal data (paths, hostnames, LAN addresses).
#
# Memory estimate of an LLM rung at a context and KV type:
#   weights (sum of the file sizes) + KV + overhead_mib, where
#   KV = (f16_mib_per_1k x ctx / 1024 + fixed_mib) x factor + state_mib, factor 1.0 for f16 and 0.53 for q8_0;
#   fixed_mib = cache cells that do not grow with the context (sliding windows), state_mib = recurrent state (F32).
# The KV numbers come from each model's config.json and llama.cpp's cache layout (n_seq 1, ubatch 512); the comment
# above each `kv` shows the arithmetic. Image rungs carry their own estimates: `min_vram_gib` (everything on the
# GPU, 1024x1024) and `offload_vram_gib` + `offload_ram_gib` (with --offload-to-cpu). Speech, transcription and music
# rungs carry `min_vram_gib` only (resident, with the compute buffers of a typical request); audio.cpp has no offload
# flag KLIF could add, and the comment above each rung says where the number comes from.
#
# quality is about the effective bits of the rung (Q8_0 8, UD-Q6_K_XL 6.5, UD-Q5_K_XL 5.5, UD-Q4_K_XL 4.5,
# UD-Q3_K_XL 3.5, UD-Q2_K_XL 2.5, UD-IQ2_XXS 2.2, UD-IQ1_* 1.7); Gemma's QAT 4-bit rung is 6.6, just above
# UD-Q6_K_XL, because quantization-aware training keeps it near full precision. bits = the file's real bits per
# weight.
#
# Choice per tier ([tiers]): walk the list in order; a model's best option is the rung of the highest quality up to
# [choice] quality_first that fits at the floor context with q8_0 KV (the smallest wins a tie), then the longest
# context up to ctx_max, then the highest quality again at that context, then f16 KV if it still fits. The first
# model with an option wins, preferring one that a lower tier did not already take. Image tiers: the highest quality
# that fits the largest GPU, else the highest that fits with --offload-to-cpu.

schema = 2

[tiers]
fast = ["gemma-4-26b-a4b", "gemma-4-12b", "gemma-4-e4b", "gemma-4-e2b"]
deep = ["glm-5.3-flash", "deepseek-v4-flash", "qwen3.8-27b", "gemma-4-31b", "gemma-4-12b", "gemma-4-e4b"]
max = ["glm-5.3", "deepseek-v4-pro", "glm-5.3-flash", "deepseek-v4-flash", "qwen3.8-flash-next", "qwen3.8-27b", "gemma-4-31b"]
image = ["krea-2-turbo", "qwen-image-2.1", "flux2-klein-9b", "flux2-klein-4b", "flux1-schnell", "sdxl-lightning-4step", "sdxl-base"]
tts = ["voxcpm2", "qwen3-tts-1.7b-base", "chatterbox", "kokoro-82m"]
stt = ["whisper-large-v3-turbo"]
video = ["minimax-h3-fl2va"]   # its license grants no rights in the EU, UK, South Korea or the USA (see notes)
music = ["ace-step-1.5-xl-turbo", "ace-step-1.5-turbo", "heartmula-3b", "stable-audio-3-small-music"]

# Memory each tier may use (GiB). The VRAM pool is every counted GPU (integrated ones only without a discrete GPU);
# gpu_margin_gib is left free on each counted GPU.
# - fast (System 1): leaves more than vram_free_frac of the pool and ram_free_frac of the RAM free; dense models
#   stay in VRAM, MoE experts may go to RAM.
# - deep (System 2): the whole pool, nothing in RAM.
# - max (System 3): the pool plus the RAM minus max(ram_reserve_gib, ram_reserve_frac x RAM) for the OS.
# - image / tts / stt / video: the largest single counted GPU (these runtimes do not split across cards), plus the
#   max RAM budget with --offload-to-cpu.
[budget]
gpu_margin_gib = 1.0
fast = { vram_free_frac = 0.3333, ram_free_frac = 0.25 }
max = { ram_reserve_gib = 8.0, ram_reserve_frac = 0.10 }

[floors]
ctx = { fast = 32768, deep = 65536, max = 131072 }   # capped by the model's ctx_max
kv_min = "q8_0"
dense_min_quality = 3.0
moe_min_quality = 2.0
moe_floor_from_b = 100   # MoE models below 100B total parameters keep the dense floor

[choice]
quality_first = 5.5   # the Q5 class: quality up to here first, then context, then quality again

