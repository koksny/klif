# -------------------------------------------------------------------------------------------------- music
# Music and song generation on audio.cpp's audiocpp_server (task "gen"). Memory numbers are ESTIMATES: audio.cpp's own
# reports are CUDA / Vulkan runs on NVIDIA cards (one Vulkan RTX 3090 report for the XL package); nothing here was run on
# AMD. `audiocpp` carries the family's load / session options for the server JSON KLIF writes on adopt (keys
# "<family>.<option>", plain-word values). A music request is synchronous and can take minutes, hence --busy-timeout-ms.

[[model]]
id = "ace-step-1.5-xl-turbo"
kind = "music"
name = "ACE-Step 1.5 XL Turbo"
adapter = "audiocpp"
license = "mit"
family = "ace_step"
params_total_b = 4
hf_repo = "CaptainArni/audio.cpp-gguf"
revision = "ac4d11eda6855ddedb16e42632e1a9376bfcfa81"
port = 7080
args = ["--config", "{models_dir}\\CaptainArni--audio.cpp-gguf\\ace-step-1.5-xl-turbo.server.json", "--backend", "vulkan", "--busy-timeout-ms", "900000", "--log", "--host", "{host}", "--port", "{port}"]
audiocpp = { load_options = { "ace_step.dit_model_path" = "acestep-v15-xl-turbo" }, session_options = { "ace_step.mem_saver" = "true" } }
notes = "ACE-Step 1.5 XL (4B DiT, turbo: 8 steps, no CFG; MIT) with its 1.7B planner, text encoder and VAE in one GGUF (DiT q8_0, the rest bf16: a fully quantised planner changes the song) on audio.cpp's audiocpp_server (Vulkan zip; HIP builds for RDNA3/4 are community zips). Vocal songs from lyrics or [Instrumental], 10 to 600 s, 48 kHz stereo. The GGUF comes from the community mirror named in audio.cpp's own model spec. A request answers when the song is done (no progress, no cancel) and can take minutes: --busy-timeout-ms 900000 lets a second request wait that long (the default is 5 minutes). The first request loads the weights. KLIF writes the server JSON (task gen, ace_step.dit_model_path, ace_step.mem_saver) when you adopt it."

# Q8_0 DiT, rest BF16; weights 9.97 GiB, ESTIMATE (unmeasured on AMD): audio.cpp's XL Q8-DiT Vulkan run on an RTX 3090 (docs/reports/ace_step_xl_vulkan.md) peaked at 12.6 to 14.4 GiB per song with mem_saver, the top of that range is used
[[model.quant]]
id = "q8-dit"
label = "Q8_0 DiT (planner, encoder, VAE bf16)"
quality = 8
min_vram_gib = 14.4
files = [
  { name = "ACE-Step1.5-GGUF/xl-turbo-q8dit/ace-step-1.5-xl-turbo-q8dit.gguf", role = "model", sha256 = "60ddf6d4ebec685c89fb451af8a7983aca65c58baa6aa6e5e25d168b4b7613f8", size = 10710565056 },
]

