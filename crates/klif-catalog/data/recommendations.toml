# KLIF model recommendations, schema 1.
#
# Disclaimer: these are starting points measured on one machine. Models, drivers and backends change; your
# agent should benchmark and calibrate (`klif-cli bench <system>`). Each model keeps its own license. KLIF
# downloads only from huggingface.co, and only when you ask it to.
#
# Rules for entries (checked at load; a bad entry is skipped with a warning):
# - hf_repo is "owner/name", revision a 40-hex commit sha, file names plain paths inside the repo (no "..", each
#   listed once); repo + revision + every file's sha256 must be verifiable on the Hugging Face hub;
# - a file from ANOTHER repo names its own `repo` ("owner/name") and `revision` (40-hex, required with `repo`); they
#   override hf_repo / revision for that file (download, install folder <models_dir>\<repo with / as -->\<file>);
# - a preset made from an entry gets `model` from the file with role "model" and `mmproj` from the one with role
#   "mmproj" ({model} / {mmproj} in args); any other listed file is written into args as {file:<its name>}, which
#   becomes that file's install path;
# - `measured` only when the local file's sha256 equals the hub file;
# - no network / model-fetch flags in `args` (-hf --hf-repo -hff --hf-file -hft --hf-token -mu --model-url
#   -dr --docker-repo, and their draft / vocoder / mmproj-url forms), no secret flags (--api-key), no env
#   templates, no unknown keys;
# - no personal data (paths, hostnames, LAN addresses).
#
# Entry shape (one [[recommendation]] table per model):
#
# [[recommendation]]
# id = "example-id"                      # [a-z0-9][a-z0-9_-]*
# kind = "llm"                           # llm | image | tts | stt | video
# class = "fast"                         # llm only, optional: fast | deep | max (System 1 / 2 / 3)
# name = "Example Model 8B"
# adapter = "llama.cpp"                  # llama.cpp | sd.cpp | vllm | openai | generic
# hf_repo = "org/repo"
# revision = "<40-hex commit sha>"
# quant = "Q4_K_M"
# license = "apache-2.0"
# hardware_class = "16 GB VRAM"
# min_vram_gib = 8.0
# args = ["-m", "{model}", "-c", "{ctx}", "--host", "{host}", "--port", "{port}"]
# ctx = 16384
# files = [
#   { name = "model-Q4_K_M.gguf", role = "model", sha256 = "<64 hex>", size = 0 },
#   # optional, from another repo: role model | mmproj | other
#   # { name = "encoder.gguf", role = "other", repo = "org/other-repo", revision = "<40-hex commit sha>", sha256 = "<64 hex>", size = 0 },
# ]
# measured = { decode_tps = 0.0, prefill_tps = 0.0, hardware = "", backend = "", date = "YYYY-MM-DD" }
# notes = ""

schema = 1

