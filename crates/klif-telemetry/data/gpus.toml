# GPUs KLIF knows the theoretical peak FP32 throughput of (embedded in klif-telemetry with include_str!).
#
# One [[gpu]] per SKU:
#   name         the name Windows (DXGI) reports for the adapter. Matching ignores case, spacing, (R) and (TM).
#   vendor_id    PCI vendor id: 0x1002 AMD, 0x10DE NVIDIA, 0x8086 Intel.
#   device_ids   PCI device ids of the SKU. Optional: an entry without them is found by name only.
#   revisions    PCI revision ids, only for SKUs that share a device id with another entry and are told apart by it.
#   shaders      stream processors / CUDA cores.
#   boost_mhz    the vendor's boost (or "up to") clock the peak is computed at.
#   tflops_fp32  the vendor's published peak single precision (FP32 vector) figure. AMD RDNA 3 / RDNA 4 numbers
#                include dual-issue; NVIDIA's are shaders x 2 x boost clock. Absent = unknown, shown as "?".
#   vram_gb      the board's memory, informational (KLIF shows the amount Windows reports).
#   memory_type  GDDR6, GDDR6X, GDDR7, HBM3 ...
#   integrated   true for a GPU on the CPU's memory. Absent = KLIF decides from the name and the memory size.
#   aliases      other names Windows may report for the same SKU.
#   gpu_cores    Apple only: the GPU core count of the entry (one chip ships with several).
#   source       the page the numbers come from.
#
# Apple silicon (macOS): vendor_id 0x106B, device_ids = the SoC id from the device tree ("t8103" -> 0x8103), so an
# M1 is "106B:8103" in [gpu] and [hardware]. Only figures Apple published are listed. Every other Apple GPU is
# computed from the machine itself: gpu-core-count (IORegistry) x 128 FP32 lanes x 2 (FMA) x the top state of the
# GPU's DVFS table (device tree `arm-io/pmgr` voltage-states9), shown as an estimate. Check against the entry
# below: 8 x 128 x 2 x 1278 MHz = 2.62 TFLOPS.
#
# Lookup order: the normalized name first, then vendor + device id + revision, then vendor + device id when exactly
# one entry carries it.

schema = 1

