[package]
name = "klif-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
klif-common = { path = "../klif-common" }
klif-catalog = { path = "../klif-catalog" }
klif-supervisor = { path = "../klif-supervisor" }
klif-telemetry = { path = "../klif-telemetry" }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
log.workspace = true
# Hugging Face downloads (download.rs), bench requests (bench.rs). TLS: select TlsProvider::NativeTls explicitly.
ureq = { workspace = true, features = ["native-tls"] }
# Download verification.
sha2.workspace = true
# Control-channel and node tokens.
getrandom.workspace = true

[target.'cfg(windows)'.dependencies]
# GetLocalTime for session names (yyyyMMdd-HHmmss-fff, local time).
windows = { workspace = true, features = ["Win32_Foundation", "Win32_System_SystemInformation"] }
